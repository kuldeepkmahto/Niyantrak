<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niyantrak — Enterprise Safety Portal Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            position: relative;
            overflow: hidden;
            background: #090d16;
        }
        .login-media {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .login-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.42) contrast(1.15);
        }
        .login-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9, 13, 22, 0.62) 0%, rgba(9, 13, 22, 0.88) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: rgba(16, 22, 38, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-xl);
            padding: 2.75rem 2.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 87, 34, 0.12);
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }
        .auth-brand i {
            color: var(--accent);
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(255, 87, 34, 0.6));
        }
        .auth-brand span {
            font-family: var(--font-heading);
            font-size: 1.85rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
        }
        .auth-status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-bottom: 1.75rem;
        }
        .auth-status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        /* Demo Credentials Quick Fill */
        .demo-selector-box {
            background: rgba(21, 29, 48, 0.75);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            margin-bottom: 1.5rem;
        }
        .demo-selector-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .demo-buttons-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.45rem;
        }
        .demo-fill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            color: #cbd5e1;
            padding: 0.45rem 0.5rem;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            transition: all 0.2s;
        }
        .demo-fill-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: translateY(-1px);
        }
        .demo-fill-btn i { font-size: 0.95rem; }

        .input-group {
            position: relative;
            margin-bottom: 1.15rem;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.95rem;
            pointer-events: none;
        }
        .input-with-icon {
            padding-left: 2.75rem !important;
        }

        .auth-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            margin: 0.5rem 0 1.5rem;
            color: var(--text-muted);
        }
        .auth-actions-row a {
            color: var(--accent);
        }

        .auth-footer-links {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .auth-footer-links a {
            color: #cbd5e1;
        }
        .auth-footer-links a:hover {
            color: var(--accent);
        }

        #message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            text-align: center;
            display: none;
        }
        #message:not(:empty) {
            display: block;
        }
        #message.success {
            background: var(--safe-subtle);
            border: 1px solid var(--safe);
            color: #6ee7b7;
        }
        #message.error {
            background: var(--critical-subtle);
            border: 1px solid var(--critical);
            color: #fca5a5;
        }
        #message.warning {
            background: var(--warning-subtle);
            border: 1px solid var(--warning);
            color: #fde047;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <!-- Live Cinematic Ambient Video Background -->
        <div class="login-media" aria-hidden="true">
            <video autoplay muted loop playsinline>
                <source src="https://videos.pexels.com/video-files/36088987/15305557_1920_1080_60fps.mp4" type="video/mp4">
            </video>
        </div>

        <div class="auth-card">
            
            <a href="index.html" class="auth-brand">
                <i class="fas fa-fire-alt"></i>
                <span>NIYANTRAK</span>
            </a>
            
            <div class="auth-status-pill">
                <span class="auth-status-dot"></span>
                <span>Industrial Hazard Intelligence Network Online</span>
            </div>

            <!-- Demo Credentials Quick Selector -->
            <div class="demo-selector-box">
                <div class="demo-selector-label">
                    <span>Quick Demo Login</span>
                    <span style="color:var(--accent);">1-Click Fill</span>
                </div>
                <div class="demo-buttons-row">
                    <button type="button" class="demo-fill-btn" onclick="fillDemo('test@admin.com', 'Admin@123', 'admin')">
                        <i class="fas fa-user-shield" style="color:#ff5722"></i>
                        <span>Admin</span>
                    </button>
                    <button type="button" class="demo-fill-btn" onclick="fillDemo('test@firemen.com', 'Fire@1234', 'firemen')">
                        <i class="fas fa-fire-truck" style="color:#f59e0b"></i>
                        <span>Firemen</span>
                    </button>
                    <button type="button" class="demo-fill-btn" onclick="fillDemo('test@employee.com', 'Emp@12345', 'employee')">
                        <i class="fas fa-hard-hat" style="color:#06b6d4"></i>
                        <span>Employee</span>
                    </button>
                </div>
            </div>

            <form id="loginForm" class="auth-form">
                
                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="input-with-icon" placeholder="Work Email" required autofocus autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="input-with-icon" placeholder="Account Password" required autocomplete="current-password">
                </div>

                <div class="input-group">
                    <i class="fas fa-id-badge input-icon"></i>
                    <select id="role" name="role" class="input-with-icon">
                        <option value="admin">Administrator / Safety Chief</option>
                        <option value="firemen">Fire Response Unit</option>
                        <option value="employee">Facility Employee</option>
                        <option value="safetyofficer">Safety Compliance Officer</option>
                    </select>
                </div>

                <div class="auth-actions-row">
                    <label style="cursor:pointer;font-size:0.82rem;color:var(--text-muted);display:flex;align-items:center;gap:0.4rem;">
                        <input type="checkbox" checked style="accent-color:var(--accent);width:auto;"> Remember session
                    </label>
                    <a href="cctv.html" style="font-weight:600;"><i class="fas fa-video"></i> Direct CCTV View</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:0.95rem;">
                    <i class="fas fa-sign-in-alt"></i> Authenticate &amp; Access Dashboard
                </button>

            </form>

            <div id="message"></div>

            <div class="auth-footer-links">
                <div>Don't have an account yet? <a href="signup.html" style="color:var(--accent);font-weight:600;">Sign up free</a></div>
                <div><a href="index.html"><i class="fas fa-arrow-left"></i> Return to Home Page</a></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function fillDemo(email, pass, role) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
            document.getElementById('role').value = role;
            
            // Visual feedback
            const emailInput = document.getElementById('email');
            emailInput.style.borderColor = '#10b981';
            setTimeout(() => emailInput.style.borderColor = '', 1000);
        }

        // Check if redirected after successful registration
        if (new URLSearchParams(window.location.search).get('registered') === 'true') {
            showMessage('Account registered successfully! Please log in.', 'success');
        }
    </script>
</body>
</html>
