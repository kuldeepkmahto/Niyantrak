<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niyantrak — Enterprise Personnel Onboarding</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            position: relative;
            overflow: hidden;
            background: #090d16;
        }
        .login-media {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .login-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.42) contrast(1.15);
        }
        .login-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9, 13, 22, 0.62) 0%, rgba(9, 13, 22, 0.88) 100%);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            background: rgba(16, 22, 38, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-xl);
            padding: 2.75rem 2.25rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 87, 34, 0.12);
        }
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            text-decoration: none;
        }
        .auth-brand i {
            color: var(--accent);
            font-size: 2rem;
            filter: drop-shadow(0 0 10px rgba(255, 87, 34, 0.6));
        }
        .auth-brand span {
            font-family: var(--font-heading);
            font-size: 1.85rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.06em;
        }
        .auth-status-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-bottom: 1.75rem;
        }
        .auth-status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.1rem;
        }
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.95rem;
            pointer-events: none;
        }
        .input-with-icon {
            padding-left: 2.75rem !important;
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .grid-2-col {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .auth-footer-links {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .auth-footer-links a {
            color: #cbd5e1;
        }
        .auth-footer-links a:hover {
            color: var(--accent);
        }

        #message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            text-align: center;
            display: none;
        }
        #message:not(:empty) {
            display: block;
        }
        #message.success {
            background: var(--safe-subtle);
            border: 1px solid var(--safe);
            color: #6ee7b7;
        }
        #message.error {
            background: var(--critical-subtle);
            border: 1px solid var(--critical);
            color: #fca5a5;
        }
        #message.warning {
            background: var(--warning-subtle);
            border: 1px solid var(--warning);
            color: #fde047;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <!-- Live Cinematic Ambient Video Background -->
        <div class="login-media" aria-hidden="true">
            <video autoplay muted loop playsinline>
                <source src="https://videos.pexels.com/video-files/36088987/15305557_1920_1080_60fps.mp4" type="video/mp4">
            </video>
        </div>

        <div class="auth-card">
            
            <a href="index.html" class="auth-brand">
                <i class="fas fa-fire-alt"></i>
                <span>NIYANTRAK</span>
            </a>
            
            <div class="auth-status-pill">
                <span class="auth-status-dot"></span>
                <span>Personnel Safety Registry &bull; Access Provisioning</span>
            </div>

            <form id="signupForm" class="auth-form">
                
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="fullname" class="input-with-icon" placeholder="Full Legal Name" required autofocus>
                </div>

                <div class="grid-2-col">
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" class="input-with-icon" placeholder="Corporate Email" required>
                    </div>

                    <div class="input-group">
                        <i class="fas fa-phone-alt input-icon"></i>
                        <input type="tel" id="phone" class="input-with-icon" placeholder="Contact Mobile" required>
                    </div>
                </div>

                <div class="grid-2-col">
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" class="input-with-icon" placeholder="Password (8+ chars)" required minlength="8">
                    </div>

                    <div class="input-group">
                        <i class="fas fa-shield-alt input-icon"></i>
                        <input type="password" id="confirmpassword" class="input-with-icon" placeholder="Confirm Password" required minlength="8">
                    </div>
                </div>

                <div class="input-group">
                    <i class="fas fa-id-badge input-icon"></i>
                    <select id="role" name="role" class="input-with-icon" required>
                        <option value="">Select Operational Role...</option>
                        <option value="admin">Administrator / Incident Command</option>
                        <option value="firemen">Firemen / Emergency Response Team</option>
                        <option value="employee">Industrial Employee / Field Staff</option>
                    </select>
                </div>

                <div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:1.25rem;line-height:1.4;">
                    <i class="fas fa-info-circle"></i> Accounts are provisioned under enterprise OSHA &amp; NFPA 72 compliance governance.
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;padding:0.8rem;font-size:0.95rem;">
                    <i class="fas fa-user-plus"></i> Create Enterprise Account
                </button>

            </form>

            <div id="message"></div>

            <div class="auth-footer-links">
                <div>Already hold verified credentials? <a href="login.html" style="color:var(--accent);font-weight:600;">Sign In here</a></div>
                <div><a href="index.html"><i class="fas fa-arrow-left"></i> Return to Home Page</a></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
